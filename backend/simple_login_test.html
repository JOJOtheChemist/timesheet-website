<!DOCTYPE html>
<html>
<head>
    <title>简单登录测试</title>
</head>
<body>
    <h1>登录测试</h1>
    <form id="loginForm">
        <input type="text" id="username" placeholder="用户名" value="z"><br><br>
        <input type="password" id="password" placeholder="密码" value="z"><br><br>
        <button type="submit">登录</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = '<p style="color: green;">登录成功！Token: ' + data.access_token.substring(0, 50) + '...</p>';
                } else {
                    result.innerHTML = '<p style="color: red;">登录失败: ' + data.detail + '</p>';
                }
            } catch (error) {
                result.innerHTML = '<p style="color: red;">错误: ' + error.message + '</p>';
            }
        });
    </script>
</body>
</html>
