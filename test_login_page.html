<!DOCTYPE html>
<html>
<head>
    <title>登录测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>登录功能测试</h1>
    
    <div class="test">
        <h3>测试1: 健康检查</h3>
        <button onclick="testHealth()">测试健康检查</button>
        <div id="health-result"></div>
    </div>
    
    <div class="test">
        <h3>测试2: 登录API</h3>
        <button onclick="testLogin()">测试登录 (nuo/nuo)</button>
        <div id="login-result"></div>
    </div>
    
    <div class="test">
        <h3>测试3: 项目API (需要认证)</h3>
        <button onclick="testProjects()">测试项目API</button>
        <div id="projects-result"></div>
    </div>

    <script>
        let token = '';
        
        async function testHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                document.getElementById('health-result').innerHTML = 
                    `<div class="success">✅ 健康检查成功: ${JSON.stringify(data)}</div>`;
            } catch (error) {
                document.getElementById('health-result').innerHTML = 
                    `<div class="error">❌ 健康检查失败: ${error.message}</div>`;
            }
        }
        
        async function testLogin() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'nuo',
                        password: 'nuo'
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    token = data.access_token;
                    document.getElementById('login-result').innerHTML = 
                        `<div class="success">✅ 登录成功! Token: ${token.substring(0, 50)}...</div>`;
                } else {
                    document.getElementById('login-result').innerHTML = 
                        `<div class="error">❌ 登录失败: ${JSON.stringify(data)}</div>`;
                }
            } catch (error) {
                document.getElementById('login-result').innerHTML = 
                    `<div class="error">❌ 登录请求失败: ${error.message}</div>`;
            }
        }
        
        async function testProjects() {
            if (!token) {
                document.getElementById('projects-result').innerHTML = 
                    `<div class="error">❌ 请先登录获取token</div>`;
                return;
            }
            
            try {
                const response = await fetch('/api/projects', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('projects-result').innerHTML = 
                        `<div class="success">✅ 项目API成功: ${JSON.stringify(data)}</div>`;
                } else {
                    document.getElementById('projects-result').innerHTML = 
                        `<div class="error">❌ 项目API失败: ${JSON.stringify(data)}</div>`;
                }
            } catch (error) {
                document.getElementById('projects-result').innerHTML = 
                    `<div class="error">❌ 项目API请求失败: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
