        // 绿色叶子飘落粒子 - 模仿贪吃蛇的背景流星
        function createBackgroundMeteor() {
            try {
                const meteor = document.createElement("div");
                meteor.className = "background-meteor";
                
                const meteorSize = 8 + Math.random() * 5;
                Object.assign(meteor.style, {
                    width: `${meteorSize}px`,
                    height: `${meteorSize}px`,
                    position: "fixed",
                    top: "0",
                    left: "0",
                    zIndex: "40",
                    opacity: "0.75",
                    background: "transparent"
                });
                
                // 创建叶子像素点
                createBackgroundMeteorPixels(meteor, meteorSize, 1.5);
                
                // 计算叶子飘落轨迹，从右上角飘到左下角
                const startX = window.innerWidth + Math.random() * 250;
                const startY = -meteorSize - Math.random() * 70;
                const endX = -meteorSize - Math.random() * 120;
                const endY = window.innerHeight + Math.random() * 100; // 飘到底部再消失
                
                // 设置初始位置和旋转，模拟叶子自然飘落
                gsap.set(meteor, { 
                    x: startX, 
                    y: startY, 
                    rotation: (Math.random() - 0.5) * 360 // 随机旋转角度，模拟叶子飘落
                });
                
                document.getElementById('meteor-container').appendChild(meteor);
                
                // 创建叶子尾迹（绿色）
                const trail = document.createElement("div");
                trail.className = "meteor-trail";
                const trailColor = '#22c55e'; // 绿色尾迹
                Object.assign(trail.style, {
                    position: "fixed",
                    width: `${meteorSize * 0.7}px`,
                    height: `${meteorSize * 0.7}px`,
                    background: trailColor, // 绿色尾迹
                    opacity: "0.4",
                    borderRadius: "50%",
                    filter: "blur(1px)",
                    zIndex: "39"
                });
                
                document.getElementById('meteor-container').appendChild(trail);
                
                // 使用GSAP动画叶子飘落，添加摇摆效果
                const tl = gsap.timeline({
                    onComplete: () => {
                        // 清理叶子和尾迹
                        [meteor, trail].forEach(el => {
                            if (el.parentNode) {
                                el.parentNode.removeChild(el);
                            }
                        });
                    }
                });
                
                // 主要飘落动画，更长的持续时间
                tl.to(meteor, {
                    x: endX,
                    y: endY,
                    duration: 8.0 + Math.random() * 3.0, // 8-11秒，更长的飘落时间
                    ease: "power1.out", // 更自然的缓动
                    onUpdate() {
                        const progress = this.progress();
                        if (progress > 0.08) {
                            gsap.set(trail, {
                                x: gsap.utils.interpolate(startX, endX, Math.max(0, progress - 0.08)),
                                y: gsap.utils.interpolate(startY, endY, Math.max(0, progress - 0.08)),
                                opacity: 0.4 * (1 - progress)
                            });
                        }
                    }
                });
                
                // 添加摇摆效果，模拟叶子飘落时的摇摆
                const swingDuration = 1.2 + Math.random() * 0.6;
                const swingAmount = 20 + Math.random() * 15;
                
                // 第一个摇摆周期
                tl.to(meteor, {
                    x: `+=${(Math.random() - 0.5) * swingAmount}`,
                    rotation: `+=${(Math.random() - 0.5) * 60}`,
                    duration: swingDuration,
                    ease: "power1.inOut",
                    yoyo: true,
                    repeat: 3
                }, 1.0);
                
                // 第二个摇摆周期
                tl.to(meteor, {
                    x: `+=${(Math.random() - 0.5) * swingAmount}`,
                    rotation: `+=${(Math.random() - 0.5) * 60}`,
                    duration: swingDuration,
                    ease: "power1.inOut",
                    yoyo: true,
                    repeat: 2
                }, 3.0);
                
                // 第三个摇摆周期
                tl.to(meteor, {
                    x: `+=${(Math.random() - 0.5) * swingAmount}`,
                    rotation: `+=${(Math.random() - 0.5) * 60}`,
                    duration: swingDuration,
                    ease: "power1.inOut",
                    yoyo: true,
                    repeat: 2
                }, 5.0);
                
                console.log('绿色叶子已创建:', meteor);
            } catch (error) {
                console.error('创建绿色叶子失败:', error);
            }
        }

        // 创建背景流星的像素点（绿色叶子效果）
        function createBackgroundMeteorPixels(meteor, meteorSize, pixelSize) {
            const grid = meteorSize / pixelSize;
            const center = grid / 2;
            
            // 绿色系颜色，模拟叶子
            const greenColors = [
                '#4ade80',  // 浅绿色
                '#22c55e',  // 绿色
                '#16a34a',  // 深绿色
                '#15803d',  // 暗绿色
                '#166534',  // 深暗绿色
                '#14532d'   // 墨绿色
            ];
            
            for (let y = 0; y < grid; y++) {
                for (let x = 0; x < grid; x++) {
                    const dx = x - center;
                    const dy = y - center;
                    const dist = Math.hypot(dx, dy);
                    
                    if (x + y >= grid / 2 && x + y <= grid * 1.5) {
                        const px = document.createElement("div");
                        const randomColor = greenColors[Math.floor(Math.random() * greenColors.length)];
                        
                        Object.assign(px.style, {
                            position: "absolute",
                            width: `${pixelSize}px`,
                            height: `${pixelSize}px`,
                            left: `${x * pixelSize}px`,
                            top: `${y * pixelSize}px`,
                            backgroundColor: randomColor, // 绿色叶子
                            opacity: "0.8",
                            borderRadius: Math.random() > 0.3 ? "0" : "50%", // 70%方形，30%圆形，模拟叶子形状
                            boxShadow: `0 0 ${pixelSize * 0.5}px ${randomColor}` // 添加发光效果
                        });
                        meteor.appendChild(px);
                    }
                }
            }
        }

        // 蓝色萤火虫粒子效果
        function createFireflyParticle() {
            try {
                const particle = document.createElement("div");
                particle.className = "firefly-particle";
                
                // 随机大小和颜色
                const size = Math.random() * 6 + 3;
                const colors = [
                    '#4f9cff',  // 贪吃蛇蓝色
                    '#2a5cff',  // 深蓝色
                    '#a0c8ff',  // 浅蓝色

                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                Object.assign(particle.style, {
                    position: "fixed",
                    width: `${size}px`,
                    height: `${size}px`,
                    backgroundColor: randomColor,
                    borderRadius: Math.random() > 0.3 ? "50%" : "0", // 70%圆形，30%方形
                    pointerEvents: "none",
                    zIndex: "3",
                    opacity: "0.9",
                    boxShadow: `0 0 ${size * 2}px ${randomColor}, 0 0 ${size * 4}px ${randomColor}`,
                    filter: "blur(0.5px)"
                });
                
                // 随机起始位置，更均匀的分布
                const startX = Math.random() * window.innerWidth;
                const startY = Math.random() * window.innerHeight;
                
                // 避免萤火虫过于集中在边缘
                const margin = 100;
                const adjustedX = Math.max(margin, Math.min(window.innerWidth - margin, startX));
                const adjustedY = Math.max(margin, Math.min(window.innerHeight - margin, startY));
                
                // 设置初始位置
                particle.style.left = adjustedX + 'px';
                particle.style.top = adjustedY + 'px';
                
                document.getElementById('floating-particles').appendChild(particle);
                activeFireflies++;
                console.log(`萤火虫创建，当前数量: ${activeFireflies}`);
                
                // 萤火虫飘动动画
                if (typeof gsap !== 'undefined') {
                    // 创建多个飘动点，模拟萤火虫飞行轨迹
                    const flightPoints = [];
                    const numPoints = 3 + Math.floor(Math.random() * 3); // 3-5个点
                    
                    for (let i = 0; i < numPoints; i++) {
                        const offsetX = (Math.random() - 0.5) * 150;
                        const offsetY = (Math.random() - 0.5) * 150;
                        flightPoints.push({
                            x: startX + offsetX,
                            y: startY + offsetY,
                            duration: 3 + Math.random() * 2 // 3-5秒，更长的生命周期
                        });
                    }
                    
                    // 创建时间轴动画
                    const tl = gsap.timeline({
                        onComplete: () => {
                            if (particle.parentNode) {
                                particle.parentNode.removeChild(particle);
                                activeFireflies--;
                                console.log(`萤火虫消失，当前数量: ${activeFireflies}`);
                            }
                        }
                    });
                    
                    // 添加闪烁效果
                    tl.to(particle, {
                        opacity: 0.3,
                        duration: 0.5,
                        ease: "power1.inOut"
                    }, 0);
                    
                    // 添加飘动轨迹
                    flightPoints.forEach((point, index) => {
                        tl.to(particle, {
                            x: point.x - adjustedX,
                            y: point.y - adjustedY,
                            duration: point.duration,
                            ease: "power1.out"
                        }, index * 0.5);
                        
                        // 在轨迹点闪烁
                        tl.to(particle, {
                            opacity: 0.9,
                            duration: 0.2,
                            ease: "power1.inOut"
                        }, index * 0.5 + point.duration * 0.5);
                    });
                    
                    // 最终消失
                    tl.to(particle, {
                        opacity: 0,
                        scale: 0.5,
                        duration: 1,
                        ease: "power1.out"
                    });
                    
                } else {
                    // 备用CSS动画
                    const endX = adjustedX + (Math.random() - 0.5) * 200;
                    const endY = adjustedY + (Math.random() - 0.5) * 200;
                    
                    particle.style.transition = `all ${6 + Math.random() * 4}s ease-out`;
                    particle.style.transform = `translate(${endX - adjustedX}px, ${endY - adjustedY}px) scale(0.5)`;
                    particle.style.opacity = '0';
                    
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.parentNode.removeChild(particle);
                            activeFireflies--;
                            console.log(`萤火虫消失(CSS模式)，当前数量: ${activeFireflies}`);
                        }
                    }, 10000);
                }
                
                console.log('萤火虫粒子已创建:', particle);
            } catch (error) {
                console.error('创建萤火虫粒子失败:', error);
            }
        }

        // 保存子任务到数据库
        async function saveSubtaskToDatabase(timeSlot, subtaskId, projectId, scheduleId, fieldType) {
            try {
                if (!scheduleId) {
                    // 如果没有日程ID，需要先创建日程
                    const newSchedule = {
                        schedule_date: selectedDate,
                        time_slot: timeSlot
                    };
                    
                    // 根据字段类型设置相应的子任务ID
                    if (fieldType === 'planned') {
                        newSchedule.planned_subtask_id = subtaskId;
                    } else if (fieldType === 'actual') {
                        newSchedule.actual_subtask_id = subtaskId;
                    }
                    
                    const response = await fetch('/api/schedule', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(newSchedule)
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        console.log('子任务保存成功:', result);
                        // 不刷新整个页面，只更新当前单元格
                        updateCellAfterSave(timeSlot, subtaskId, projectId, fieldType, result.id);
                    } else {
                        const errorText = await response.text();
                        console.error('子任务保存失败，状态码:', response.status, '错误信息:', errorText);
                        throw new Error(`保存失败: ${response.status} - ${errorText}`);
                    }
                } else {
                    // 更新现有日程的子任务 - 需要先获取现有数据，然后合并更新
                    // 先获取当前日程数据
                    const currentResponse = await fetch(`/api/schedule/${selectedDate}`);
                    if (!currentResponse.ok) {
                        throw new Error('获取当前日程数据失败');
                    }
                    
                    const currentData = await currentResponse.json();
                    const currentSchedule = currentData.schedule_data.find(s => s.id == scheduleId);
                    
                    if (!currentSchedule) {
                        throw new Error('未找到当前日程记录');
                    }
                    
                    // 构建更新数据，保留现有字段
                    const updateData = {
                        planned_subtask_id: currentSchedule.planned_subtask_id,
                        planned_notes: currentSchedule.planned_notes,
                        actual_subtask_id: currentSchedule.actual_subtask_id,
                        actual_notes: currentSchedule.actual_notes,
                        mood: currentSchedule.mood
                    };
                    
                    // 根据字段类型更新相应的子任务ID
                    if (fieldType === 'planned') {
                        updateData.planned_subtask_id = subtaskId;
                    } else if (fieldType === 'actual') {
                        updateData.actual_subtask_id = subtaskId;
                    }
                    
                    const response = await fetch(`/api/schedule/${scheduleId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(updateData)
                    });
                    
                    if (response.ok) {
                        console.log('子任务更新成功');
                        // 更新成功后直接更新UI，不刷新整个页面
                        updateCellAfterSave(timeSlot, subtaskId, projectId, fieldType, scheduleId);
                    } else {
                        const errorText = await response.text();
                        console.error('子任务更新失败，状态码:', response.status, '错误信息:', errorText);
                        throw new Error(`更新失败: ${response.status} - ${errorText}`);
                    }
                }
            } catch (error) {
                console.error('保存子任务失败:', error);
                throw error;
            }
        }

        // 保存成功后更新单元格，避免刷新整个页面
        async function updateCellAfterSave(timeSlot, subtaskId, projectId, fieldType, scheduleId) {
            try {
                // 获取子任务和项目信息
                const subtaskResponse = await fetch('/api/projects');
                if (!subtaskResponse.ok) {
                    throw new Error('获取项目数据失败');
                }
                
                const projectsData = await subtaskResponse.json();
                let subtaskInfo = null;
                let projectInfo = null;
                
                // 查找子任务和项目信息
                for (const category of projectsData) {
                    for (const project of category.projects) {
                        if (project.id === projectId) {
                            projectInfo = project;
                            for (const subtask of project.subtasks) {
                                if (subtask.id === subtaskId) {
                                    subtaskInfo = subtask;
                                    break;
                                }
                            }
                            break;
                        }
                    }
                    if (subtaskInfo) break;
                }
                
                if (subtaskInfo && projectInfo) {
                    // 更新当前单元格显示
                    const cell = document.querySelector(`[data-time="${timeSlot}"][data-field="${fieldType}"]`);

        // 自动跳转到下一行（通用函数，支持所有列）
        function autoJumpToNextRow() {
            try {
                // 查找当前选中的任意列
                const currentSelectedCell = document.querySelector('.task-column.selected, .notes-column.selected, .mood-column.selected');
                if (!currentSelectedCell) return;
                
                const currentTr = currentSelectedCell.closest('tr');
                const nextRow = currentTr.nextElementSibling;
                
                if (nextRow) {
                    // 确定当前选中的列类型，保持在同一类型的列
                    let nextCell;
                    if (currentSelectedCell.classList.contains('task-column')) {
                        // 检查是计划任务列还是实际任务列
                        const currentFieldType = currentSelectedCell.querySelector('[data-field-type]')?.getAttribute('data-field-type');
                        if (currentFieldType === 'planned') {
                            nextCell = nextRow.querySelector('.task-column [data-field-type="planned"]')?.closest('.task-column');
                        } else {
                            nextCell = nextRow.querySelector('.task-column [data-field-type="actual"]')?.closest('.task-column');
                        }
                    } else if (currentSelectedCell.classList.contains('notes-column')) {
                        // 检查是计划备注列还是实际备注列
                        const currentFieldType = currentSelectedCell.querySelector('[data-field-type]')?.getAttribute('data-field-type');
                        if (currentFieldType === 'planned') {
                            nextCell = nextRow.querySelector('.notes-column [data-field-type="planned"]')?.closest('.notes-column');
                        } else {
                            nextCell = nextRow.querySelector('.notes-column [data-field-type="actual"]')?.closest('.notes-column');
                        }
                    } else if (currentSelectedCell.classList.contains('mood-column')) {
                        nextCell = nextRow.querySelector('.mood-column');
                    }
                    
                    if (nextCell) {
                        // 清除当前选择
                        document.querySelectorAll('.task-column.selected, .notes-column.selected, .mood-column.selected').forEach(col => {
                            col.classList.remove('selected');
                        });
                        
                        // 清除之前行级别的高亮
                        document.querySelectorAll('tr.selected-row').forEach(row => {
                            row.classList.remove('selected-row');
                        });
                        
                        // 选择下一行的同列
                        nextCell.classList.add('selected');
                        
                        // 高亮整行
                        nextRow.classList.add('selected-row');
                        
                        // 设置焦点
                        nextCell.focus();
                        
                        // 更新编辑位置
                        const rowIndex = Array.from(nextRow.parentNode.children).indexOf(nextRow);
                        const cellIndex = Array.from(nextRow.children).indexOf(nextCell);
                        currentEditingRow = rowIndex;
                        currentEditingColumn = cellIndex;
                        
                        // 如果是任务列，设置 selectedTimeSlotElement 以保持一致操作
                        if (nextCell.classList.contains('task-column')) {
                            const badge = nextCell.querySelector('.task-badge');
                            if (badge) {
                                selectedTimeSlotElement = badge;
                                selectedTimeSlot = badge.getAttribute('data-time-slot');
                                selectedFieldType = badge.getAttribute('data-field-type') || selectedFieldType;
                            }
                        } else if (nextCell.classList.contains('notes-column')) {
                            const span = nextCell.querySelector('.notes-text');
                            if (span) {
                                selectedTimeSlot = span.getAttribute('data-time-slot');
                                selectedFieldType = span.getAttribute('data-field-type') || selectedFieldType;
                            }
                        } else if (nextCell.classList.contains('mood-column')) {
                            const span = nextCell.querySelector('.mood-text');
                            if (span) {
                                selectedTimeSlot = span.getAttribute('data-time-slot');
                                selectedFieldType = span.getAttribute('data-field-type') || selectedFieldType;
                            }
                        }
                        
                        console.log('自动跳转到下一行:', rowIndex, cellIndex);
                    }
                }
            } catch (e) {
                console.error('自动跳转失败:', e);
            }
        }



        function initMoodQuickInput() {
            const moodSection = document.getElementById('moodQuickInput');
            const dragHandle = document.getElementById('moodDragHandle');
            
            if (!moodSection || !dragHandle) return;
            
            // 默认收缩状态
            moodSection.classList.add('collapsed');
            
            // 拖动功能
            dragHandle.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
            
            // 触摸设备支持
            dragHandle.addEventListener('touchstart', startDragTouch);
            document.addEventListener('touchmove', onDragTouch);
            document.addEventListener('touchend', stopDrag);
        }

        function startDrag(e) {
            e.preventDefault();
            // 检查是否点击的是展开按钮，如果是则不开始拖动
            if (e.target.classList.contains('mood-toggle-btn')) {
                return;
            }
            isDragging = true;
            const moodSection = document.getElementById('moodQuickInput');
            const rect = moodSection.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            moodSection.style.cursor = 'grabbing';
        }

        function startDragTouch(e) {
            e.preventDefault();
            // 检查是否触摸的是展开按钮，如果是则不开始拖动
            if (e.target.classList.contains('mood-toggle-btn')) {
                return;
            }
            
            const touch = e.touches[0];
            touchStartTime = Date.now();
            touchStartPos.x = touch.clientX;
            touchStartPos.y = touch.clientY;
            
            // 延迟启动拖动，避免与点击事件冲突
            setTimeout(() => {
                if (Date.now() - touchStartTime > 200) { // 200ms后开始拖动
                    isDragging = true;
                    const moodSection = document.getElementById('moodQuickInput');
                    const rect = moodSection.getBoundingClientRect();
                    dragOffset.x = touch.clientX - rect.left;
                    dragOffset.y = touch.clientY - rect.top;
                }
            }, 200);
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const moodSection = document.getElementById('moodQuickInput');
            const x = e.clientX - dragOffset.x;
            const y = e.clientY - dragOffset.y;
            
            // 限制在视窗范围内
            const maxX = window.innerWidth - moodSection.offsetWidth;
            const maxY = window.innerHeight - moodSection.offsetHeight;
            
            moodSection.style.left = Math.max(0, Math.min(x, maxX)) + 'px';
            moodSection.style.right = 'auto';
            moodSection.style.top = Math.max(0, Math.min(y, maxY)) + 'px';
            moodSection.style.transform = 'none';
        }

        function onDragTouch(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const moveDistance = Math.sqrt(
                Math.pow(touch.clientX - touchStartPos.x, 2) + 
                Math.pow(touch.clientY - touchStartPos.y, 2)
            );
            
            // 如果移动距离小于10px，认为是点击而不是拖动
            if (moveDistance < 10) return;
            
            const moodSection = document.getElementById('moodQuickInput');
            const x = touch.clientX - dragOffset.x;
            const y = touch.clientY - dragOffset.y;
            
            // 限制在视窗范围内
            const maxX = window.innerWidth - moodSection.offsetWidth;
            const maxY = window.innerHeight - moodSection.offsetHeight;
            
            moodSection.style.left = Math.max(0, Math.min(x, maxX)) + 'px';
            moodSection.style.right = 'auto';
            moodSection.style.top = Math.max(0, Math.min(y, maxY)) + 'px';
            moodSection.style.transform = 'none';
        }

        function stopDrag() {
            isDragging = false;
            const moodSection = document.getElementById('moodQuickInput');
            if (moodSection) {
                moodSection.style.cursor = 'grab';
            }
        }

        function toggleMoodQuickInput() {
            const moodSection = document.getElementById('moodQuickInput');
            const toggleBtn = document.querySelector('.mood-toggle-btn');
            
            if (moodSection.classList.contains('collapsed')) {
                moodSection.classList.remove('collapsed');
                toggleBtn.textContent = '▼';
                isExpanded = true;
            } else {
                moodSection.classList.add('collapsed');
                toggleBtn.textContent = '▶';
                isExpanded = false;
            }
        }

        // 当选择心情栏时展开，其他时候收缩
        function expandMoodQuickInput() {
            const moodSection = document.getElementById('moodQuickInput');
            if (moodSection && moodSection.classList.contains('collapsed')) {
                moodSection.classList.remove('collapsed');
                document.querySelector('.mood-toggle-btn').textContent = '▼';
                isExpanded = true;
            }
        }

        function collapseMoodQuickInput() {
            const moodSection = document.getElementById('moodQuickInput');
            if (moodSection && !moodSection.classList.contains('collapsed')) {
                moodSection.classList.add('collapsed');
                document.querySelector('.mood-toggle-btn').textContent = '▶';

        }

    // 切换表格列显示/隐藏的函数
    function toggleTableColumns(mode) {
        const tbody = document.getElementById('scheduleBody');
        const rows = tbody.querySelectorAll('tr');
        
        rows.forEach(row => {
            const cells = row.querySelectorAll('td');
            
            // 时间列始终显示（索引0）
            // 计划任务列（索引1）
            // 计划备注列（索引2）
            // 实际任务列（索引3）
            // 实际备注列（索引4）
            // 心情列（索引5）
            
            if (mode === 'actual') {
                // 实际模式：隐藏计划相关列，显示实际相关列
                if (cells[1]) cells[1].style.display = 'none'; // 计划任务
                if (cells[2]) cells[2].style.display = 'none'; // 计划备注
                if (cells[3]) cells[3].style.display = 'table-cell'; // 实际任务
                if (cells[4]) cells[4].style.display = 'table-cell'; // 实际备注
                if (cells[5]) cells[5].style.display = 'table-cell'; // 心情
            } else if (mode === 'plan') {
                // 计划模式：显示计划相关列，隐藏实际相关列
                if (cells[1]) cells[1].style.display = 'table-cell'; // 计划任务
                if (cells[2]) cells[2].style.display = 'table-cell'; // 计划备注
                if (cells[3]) cells[3].style.display = 'none'; // 实际任务
                if (cells[4]) cells[4].style.display = 'none'; // 实际备注
                if (cells[5]) cells[5].style.display = 'none'; // 心情
            } else {
                // 全部显示模式：显示所有列
                if (cells[1]) cells[1].style.display = 'table-cell'; // 计划任务
                if (cells[2]) cells[2].style.display = 'table-cell'; // 计划备注
                if (cells[3]) cells[3].style.display = 'table-cell'; // 实际任务
                if (cells[4]) cells[4].style.display = 'table-cell'; // 实际备注
                if (cells[5]) cells[5].style.display = 'table-cell'; // 心情
            }
        });
        
        // 表头永远不变，只改变高亮状态
        console.log(`📊 切换到${mode === 'actual' ? '实际' : mode === 'plan' ? '计划' : '全部'}模式`);
    }

    document.addEventListener('DOMContentLoaded', function() {
        const planTaskHeader = document.querySelector('.header-with-arrows');
        let currentMode = 'plan'; // 默认计划模式
        
        if (planTaskHeader) {
            // 初始化全部显示模式
            planTaskHeader.classList.add('all-mode');

    // 光标位置辅助函数：判断是否在开始/结束
    function isCaretAtStart(element) {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0) return false;
        const range = selection.getRangeAt(0).cloneRange();
        const preRange = range.cloneRange();
        preRange.selectNodeContents(element);
        preRange.setEnd(range.startContainer, range.startOffset);
        return preRange.toString().length === 0;
    }

    function isCaretAtEnd(element) {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0) return false;
        const range = selection.getRangeAt(0).cloneRange();
        const postRange = range.cloneRange();
        postRange.selectNodeContents(element);
        postRange.setStart(range.endContainer, range.endOffset);
        return postRange.toString().length === 0;
    }

    <script>
    (function(){
        if (!window.__tsAuthFetchPatched) {
            window.__tsAuthFetchPatched = true;
            const originalFetch = window.fetch.bind(window);
            window.fetch = function(resource, init) {
                try {
                    const token = localStorage.getItem('ts_auth_token');
                    const url = typeof resource === 'string' ? resource : (resource && resource.url) || '';
                    const isApi = url.startsWith('/api/') || url.startsWith(location.origin + '/api/');
                    if (token && isApi) {
                        const opts = Object.assign({}, init || {});
                        opts.headers = Object.assign({}, opts.headers || {});
                        if (!opts.headers['Authorization'] && !opts.headers['authorization']) {
                            opts.headers['Authorization'] = 'Bearer ' + token;
                        }
                        return originalFetch(resource, opts);
                    }
                } catch (e) {}
                return originalFetch(resource, init);
            };
        }
    })();
