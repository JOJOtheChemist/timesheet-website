<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>注册完成 · 初始配置</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="components/background-switcher/background-switcher.css">
	<style>
		body{min-height:100vh;display:flex;align-items:center;justify-content:center;background-color:#0b1220;color:#e5e7eb;position:relative;z-index:0}
		body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:-1}
		.card{width:420px;background:#0e1726;border:1px solid rgba(79,156,255,.3);border-radius:12px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
		.label{font-size:12px;color:#9ca3af;margin:8px 0 4px;display:block}
		.input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(79,156,255,.25);background:#0b152b;color:#e5e7eb}
		.btn{width:100%;margin-top:14px;padding:10px;border-radius:8px;border:1px solid rgba(79,156,255,.4);background:#152745;color:#cfe4ff;cursor:pointer}
		.msg{margin-top:10px;font-size:12px}
		.msg.error{color:#fca5a5}
		.msg.info{color:#93c5fd}
		.notice{background:#0b152b;border:1px solid rgba(79,156,255,.25);padding:8px;border-radius:8px;margin-bottom:10px;color:#9cc7ff;font-size:12px}
	</style>
</head>
<body>
	<div style="display:flex;flex-direction:column;align-items:center;gap:20px;">
		<div style="display:inline-block;padding:10px 18px;border:1px solid rgba(79,156,255,.6);border-radius:999px;background:rgba(0,0,0,0.35);color:#cfe4ff;font-weight:400;letter-spacing:1px;text-shadow:0 1px 2px rgba(0,0,0,.6);font-size:20px;">欢迎，完善信息以开始使用</div>
		<div class="card">
			<h1 class="text-xl mb-3" style="color:#4f9cff">初始配置</h1>
			<div class="notice">完善以下信息后，点击下方按钮由 AI 生成项目与子任务建议。</div>
			<label class="label">您的专业</label>
			<input class="input" id="pr_major" placeholder="例如：金融、计算机、中文" autocomplete="off">
			<label class="label">备考目标</label>
			<input class="input" id="pr_goal" placeholder="例如：考研金融初试/四六级/CPA 科目一" autocomplete="off">
			<label class="label">最近在做的项目</label>
			<input class="input" id="pr_projects" placeholder="例如：英语练习、专业课刷题、政治作业" autocomplete="off">
			<button class="btn" type="button" id="pr_waitBtn">AI生成项目（<span id="pr_wait">0</span>s）</button>
			<div id="pr_msg" class="msg info">准备就绪</div>
			<div id="pr_result" class="msg" style="margin-top:8px;white-space:pre-wrap"></div>
			<button class="btn" type="button" id="go_edit_btn" style="display:none;margin-top:8px">开始填表</button>
		</div>
	</div>

	<script>
	(function(){
		const API_BASE = '';
		// 从URL参数获取用户名和密码
		const urlParams = new URLSearchParams(window.location.search);
		const urlUsername = urlParams.get('username');
		const urlPassword = urlParams.get('password');
		if (urlUsername && urlPassword) {
			try {
				localStorage.setItem('ts_postreg_username', urlUsername);
				localStorage.setItem('ts_postreg_password', urlPassword);
				console.log('Set credentials from URL parameters');
			} catch (e) {
				console.error('Failed to set localStorage from URL:', e);
			}
		}
		const TARGET_EDIT = 'daily_schedule.html';
		const prMajor = document.getElementById('pr_major');
		const prGoal = document.getElementById('pr_goal');
		const prProjects = document.getElementById('pr_projects');
		const prWaitBtn = document.getElementById('pr_waitBtn');
		const prWait = document.getElementById('pr_wait');
		const prMsg = document.getElementById('pr_msg');
		const prResult = document.getElementById('pr_result');
		const goEditBtn = document.getElementById('go_edit_btn');
		let timer = null; 
		let state = 'idle';

		// 恢复可能缓存的表单
		try{
			prMajor.value = localStorage.getItem('ts_postreg_major') || '';
			prGoal.value = localStorage.getItem('ts_postreg_goal') || '';
			prProjects.value = localStorage.getItem('ts_postreg_projects') || '';
		}catch(e){}
		
		[prMajor, prGoal, prProjects].forEach(inp=>{
			inp.addEventListener('input', ()=>{
				try{
					localStorage.setItem('ts_postreg_major', prMajor.value||'');
					localStorage.setItem('ts_postreg_goal', prGoal.value||'');
					localStorage.setItem('ts_postreg_projects', prProjects.value||'');
				}catch(e){}
			});
		});

		async function fetchWithTimeout(url, options, timeoutMs){
			const controller = new AbortController();
			const id = setTimeout(()=>controller.abort(), timeoutMs || 12000);
			try{ 
				return await fetch(url, { ...(options||{}), signal: controller.signal }); 
			}
			finally{ 
				clearTimeout(id); 
			}
		}
		
		function isLikelyJWT(t){ 
			return typeof t==='string' && t.split('.').length===3; 
		}
		
		async function ensureToken(){
			let token = localStorage.getItem('ts_auth_token');
			if (token && isLikelyJWT(token)) return token;
			const username = localStorage.getItem('ts_postreg_username')||localStorage.getItem('ts_auth_username')||'';
			const password = localStorage.getItem('ts_postreg_password')||localStorage.getItem('ts_auth_password')||'';
			if(!username || !password) { 
				console.error("No username/password in localStorage. Please register first."); 
				return ""; 
			}
			try{
				const res = await fetchWithTimeout(`${API_BASE}/api/auth/login`, { 
					method:'POST', 
					headers:{'Content-Type':'application/json'}, 
					body: JSON.stringify({ username, password }) 
				}, 12000);
				const data = await res.json();
				if(!res.ok) throw new Error(data.detail||'登录失败');
				localStorage.setItem('ts_auth_token', data.access_token);
				localStorage.setItem('ts_auth_username', username);
				localStorage.setItem('ts_auth_password', password);
				return data.access_token;
			}catch(e){ 
				console.error('Token获取失败:', e);
				return ''; 
			}
		}
		
		function startTimer(){
			let s = 0;
			prWait.textContent = '0';
			if (timer) { clearInterval(timer); }
			timer = setInterval(()=>{
				s += 1;
				prWait.textContent = String(s);
				// 分段提示
				if (s === 3) {
					prMsg.textContent = '正在分析您的专业背景...';
				} else if (s === 8) {
					prMsg.textContent = '正在生成个性化项目建议...';
				} else if (s === 15) {
					prMsg.textContent = 'AI正在深度思考中，请稍候...';
				} else if (s === 25) {
					prMsg.textContent = '即将完成，正在优化建议...';
				}
			}, 1000);
		}
		
		function stopTimer(){ 
			if(timer){ 
				clearInterval(timer); 
				timer=null; 
			} 
		}

		// 保存用户画像的函数
		const saveUserProfile = async () => {
			const major = prMajor.value.trim();
			const goal = prGoal.value.trim();
			const projects = prProjects.value.trim();
			const token = await ensureToken();
			if(!token) { 
				throw new Error("无法获取认证令牌，请先注册或登录"); 
			}
			
			const profileData = {
				major: major || null,
				goal: goal || null,
				projects: projects || null
			};
			
			const res = await fetchWithTimeout(`${API_BASE}/api/user/profile`, {
				method: 'PUT',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': `Bearer ${token}`
				},
				body: JSON.stringify(profileData)
			}, 10000);
			
			const data = await res.json();
			if (!res.ok) {
				throw new Error(data.detail || '保存用户画像失败');
			}
			
			return data;
		};

		async function callAgent(){
			console.log('开始调用AI生成项目...');
			
			// 先保存用户画像
			try {
				await saveUserProfile();
				console.log('用户画像保存成功');
			} catch (err) {
				console.error('保存用户画像失败:', err);
				// 继续执行，不阻止AI生成
			}
			
			const major = prMajor.value.trim();
			const goal = prGoal.value.trim();
			const projects = prProjects.value.trim();
			const token = await ensureToken();
			
			if(!token) { 
				throw new Error("无法获取认证令牌，请先注册或登录"); 
			}
			
			const message = [
				'你是智能项目管理助手，只负责子任务的识别、项目归属与增删改查。',
				'现在请"直接给出要创建的项目与子任务清单"，不要询问，不要犹豫。',
				'若用户未明确，也请根据常识与上下文进行合理补全，至少返回1个项目与若干子任务。',
				'请优先将以下资料解析为可创建的任务：',
				`- 专业：${major||'-'}`,
				`- 备考目标：${goal||'-'}`,
				`- 最近在做的项目：${projects||'-'}`,
				'输出格式：用简短条目列出【项目 -> 子任务】（可多项），必要时合并到更大项目（如"英语练习"、"金融考研专业课复习"等）。',
			].join('\n');
			
			console.log('发送请求到AI agent...', message.substring(0, 100) + '...');
			
			const res = await fetchWithTimeout(`${API_BASE}/api/agent/chat`, { 
				method:'POST', 
				headers:{
					'Content-Type':'application/json', 
					'Authorization': `Bearer ${token}`
				}, 
				body: JSON.stringify({ message }) 
			}, 30000);
			
			const data = await res.json();
			console.log('AI响应:', data);
			
			if(!res.ok) throw new Error(data.detail||'生成失败');
			
			const tRaw = (data.thought||'').trim();
			const thought = tRaw && tRaw !== '无思考过程' ? `思考：${tRaw}\n` : '';
			let text = `${thought}${data.reply||'生成完成'}`;
			
			if (Array.isArray(data.tasks) && data.tasks.length){
				const byProj = {};
				for (const t of data.tasks){
					const pj = (t && t.project_name) || '未命名项目';
					if(!byProj[pj]) byProj[pj] = [];
					byProj[pj].push((t && t.subtask_name) || '未命名子任务');
				}
				text += '\n' + Object.keys(byProj).map(p=>`【${p}】\n- `+byProj[p].join('\n- ')).join('\n');
			}
			
			prResult.className='msg info';
			prResult.textContent=text;
			console.log('AI生成完成');
			return true;
		}

		prWaitBtn.addEventListener('click', async function(){
			console.log('按钮被点击，当前状态:', state);
			
			if(state==='ready'){ 
				location.href=TARGET_EDIT; 
				return; 
			}
			if(state!=='idle') {
				console.log('状态不是idle，不执行');
				// 允许在等待状态下直接进入编辑页，兼容“可点击+倒计时”诉求
				if (state === 'waiting') {
					location.href = TARGET_EDIT;
				}
				return;
			}
			
			state='waiting'; 
			prWaitBtn.disabled=false; // 保持可点击
			// 保持倒计时显示
			startTimer();
			prMsg.className='msg info'; 
			prMsg.textContent='正在根据您的信息生成建议...'; 
			prResult.textContent='';
			
			try{ 
				const ok = await callAgent(); 
				if(ok){ 
					state='ready'; 
					prMsg.textContent=''; 
					goEditBtn.style.display='block'; 
					prWaitBtn.style.display='none'; 
				} else { 
					state='idle'; 
					prMsg.className='msg error'; 
					prMsg.textContent='生成失败，请稍后重试'; 
					prWaitBtn.disabled=false; 
					prWaitBtn.textContent = 'AI生成项目（0s）';
				} 
			}
			catch(err){ 
				console.error('callAgent出错:', err);
				state='idle'; 
				prMsg.className='msg error'; 
				prMsg.textContent=err.message||'生成失败'; 
				prWaitBtn.disabled=false; 
				prWaitBtn.textContent = 'AI生成项目（0s）';
			}
			finally{ 
				stopTimer(); 
			}
		});
		
		goEditBtn.addEventListener('click', ()=>{ 
			location.href=TARGET_EDIT; 
		});
		
		console.log('onboarding页面初始化完成');
	})();
	</script>
</body>
</html>
