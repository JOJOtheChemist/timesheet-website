<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复盘对话 - 时间管理助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 80vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .chat-header {
            background: linear-gradient(135deg, #4f9cff 0%, #6bb6ff 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: fadeInUp 0.3s ease-out;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #4f9cff 0%, #6bb6ff 100%);
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
        }

        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #4f9cff 0%, #6bb6ff 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.ai .message-content {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 5px;
        }

        .message-time {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .chat-input-container {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #4f9cff;
            box-shadow: 0 0 0 3px rgba(79, 156, 255, 0.1);
        }

        .send-button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f9cff 0%, #6bb6ff 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(79, 156, 255, 0.3);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            max-width: 70%;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .suggestion {
            padding: 8px 16px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .suggestion:hover {
            background: #4f9cff;
            color: white;
            border-color: #4f9cff;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            🤖 复盘对话助手
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <div>你好！我是你的复盘对话助手。我可以帮助你分析时间管理数据、总结经验教训、制定改进计划。</div>
                    <div class="message-time">刚刚</div>
                </div>
            </div>
            
            <div class="message ai">
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <div>请选择你想要复盘的内容：</div>
                    <div class="suggestions">
                        <div class="suggestion" onclick="sendQuickMessage('分析今天的工作效率')">分析今天的工作效率</div>
                        <div class="suggestion" onclick="sendQuickMessage('回顾本周的时间分配')">回顾本周的时间分配</div>
                        <div class="suggestion" onclick="sendQuickMessage('总结项目完成情况')">总结项目完成情况</div>
                        <div class="suggestion" onclick="sendQuickMessage('分析时间浪费的原因')">分析时间浪费的原因</div>
                    </div>
                    <div class="message-time">刚刚</div>
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <div class="message-avatar">AI</div>
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input type="text" class="chat-input" id="chatInput" placeholder="输入你的复盘问题..." onkeypress="handleKeyPress(event)">
                <button class="send-button" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const typingIndicator = document.getElementById('typingIndicator');

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${isUser ? '我' : 'AI'}</div>
                <div class="message-content">
                    <div>${content}</div>
                    <div class="message-time">${timeString}</div>
                </div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            typingIndicator.style.display = 'flex';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            addMessage(message, true);
            chatInput.value = '';
            
            // 显示正在输入
            showTyping();
            
            // 模拟AI回复
            setTimeout(() => {
                hideTyping();
                const response = generateAIResponse(message);
                addMessage(response);
            }, 1000 + Math.random() * 2000);
        }

        function sendQuickMessage(message) {
            addMessage(message, true);
            
            // 显示正在输入
            showTyping();
            
            // 模拟AI回复
            setTimeout(() => {
                hideTyping();
                const response = generateAIResponse(message);
                addMessage(response);
            }, 1000 + Math.random() * 2000);
        }

        function generateAIResponse(userMessage) {
            const responses = {
                '分析今天的工作效率': `根据你的时间记录，我来分析一下今天的工作效率：

📊 **时间分配分析**
• 计划时间：8小时
• 实际工作时间：6.5小时
• 效率比：81.25%

🎯 **高效时段**
• 上午9:00-11:00：专注度最高
• 下午2:00-4:00：任务完成率最高

⚠️ **需要改进的地方**
• 上午11:00-12:00：注意力分散，建议调整任务安排
• 下午4:00-5:00：效率下降，可以考虑休息

💡 **建议**
1. 在高效时段安排重要任务
2. 在低效时段安排轻松任务或休息
3. 考虑调整作息时间，保持最佳状态`,
                
                '回顾本周的时间分配': `让我来回顾一下你这周的时间分配情况：

📅 **本周概览**
• 总工作时间：40小时
• 计划完成率：85%
• 平均每日效率：82%

📈 **项目分布**
• 项目A：35% (14小时)
• 项目B：25% (10小时)
• 学习提升：20% (8小时)
• 会议沟通：20% (8小时)

🎯 **亮点**
• 项目A进展顺利，提前完成里程碑
• 学习时间安排合理，技能提升明显

🔧 **改进建议**
• 会议时间可以进一步优化
• 项目B需要更多专注时间
• 建议增加复盘时间，总结经验`,
                
                '总结项目完成情况': `基于你的项目记录，我来总结一下完成情况：

🚀 **项目A - 网站开发**
• 进度：90%完成
• 状态：按计划进行
• 预计完成：本周五
• 关键成果：核心功能已实现

📱 **项目B - 移动应用**
• 进度：60%完成
• 状态：略有延迟
• 预计完成：下周中
• 关键成果：UI设计完成

📊 **整体评估**
• 按时完成率：75%
• 质量评分：8.5/10
• 团队协作：良好

💡 **经验总结**
1. 详细规划有助于按时完成
2. 及时沟通避免返工
3. 预留缓冲时间很重要`,
                
                '分析时间浪费的原因': `让我分析一下你时间浪费的主要原因：

⏰ **时间浪费分析**
• 社交媒体：2小时/天
• 无效会议：1.5小时/天
• 任务切换：1小时/天
• 等待时间：0.5小时/天

🔍 **根本原因**
1. **缺乏专注**：频繁查看手机和邮件
2. **计划不周**：任务安排不够合理
3. **优先级不清**：重要任务被琐事打断
4. **环境干扰**：工作环境不够安静

💡 **改进策略**
1. **番茄工作法**：25分钟专注+5分钟休息
2. **时间块**：为不同类型任务分配固定时间
3. **断网时间**：每天2小时完全断网工作
4. **环境优化**：整理工作空间，减少干扰

🎯 **预期效果**
实施这些策略后，预计可以节省30%的时间，提高工作效率。`
            };
            
            return responses[userMessage] || `我理解你想了解"${userMessage}"。让我为你分析一下：

这是一个很好的复盘问题！基于你的时间管理数据，我可以看到几个关键点：

📊 **数据洞察**
• 你的时间分配相对合理
• 有一些优化空间
• 整体效率在提升

💡 **建议**
1. 继续保持当前的好习惯
2. 关注细节，持续改进
3. 定期复盘，总结经验

有什么具体的数据或情况想要我详细分析吗？`;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            chatInput.focus();
        });
    </script>
</body>
</html>
