<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>登录</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#e5e7eb}
		.card{background:#0e1726;border:1px solid rgba(79,156,255,.3);border-radius:12px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
		.btn{padding:10px 14px;border-radius:8px;border:1px solid rgba(79,156,255,.4);background:#152745;color:#cfe4ff;cursor:pointer}
	</style>
</head>
<body>
	<div class="card">
		<h1 class="text-xl mb-3" style="color:#4f9cff">账户登录</h1>
		<p class="mb-4 text-sm text-gray-300">点击下方按钮打开登录窗口。登录成功后将自动跳转到上一页面。</p>
		<button id="openLogin" class="btn">打开登录</button>
		<p id="error" class="mt-3 text-sm" style="color:#fca5a5"></p>
	</div>

	<script src="components/auth-modal/auth-modal.js"></script>
	<script>
	(function(){
		function getParam(name){
			const url = new URL(location.href);
			return url.searchParams.get(name);
		}
		const redirect = getParam('redirect') || 'daily_schedule.html';
		const btn = document.getElementById('openLogin');
		btn.addEventListener('click', function(){
			if (window.tsAuth && window.tsAuth.openLogin) window.tsAuth.openLogin();
		});
		document.addEventListener('ts-auth:login', function(){
			location.href = redirect;
		}, { once: true });
		// 若已登录则直接跳转
		if (localStorage.getItem('ts_auth_token')) {
			location.replace(redirect);
		}
	})();
	</script>
</body>
</html>
