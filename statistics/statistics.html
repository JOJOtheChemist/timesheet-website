<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>时间统计与分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 0;
        }

        /* 暗色遮罩（60% 透明度） */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: transparent;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: rgba(17, 24, 39, 0.5);
            padding: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            color: #E5E7EB;
        }

        .header h1 {
            color: #4f9cff;
            margin-bottom: 15px;
            font-size: 3rem;
            border-bottom: 2px solid rgba(79, 156, 255, 0.5);
            padding-bottom: 8px;
            text-shadow: none;
        }

        .header p {
            color: #f1f5f9;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .date-picker {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-picker label {
            color: #4f9cff !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            white-space: nowrap !important;
            text-shadow: none !important;
            font-family: inherit !important;
        }

        .date-picker input {
            padding: 8px 12px !important;
            background: rgba(10, 10, 26, 0.8) !important;
            border: 2px solid rgba(79, 156, 255, 0.5) !important;
            border-radius: 6px !important;
            font-size: 14px !important;
            color: #4f9cff !important;
            transition: all 0.3s ease !important;
            width: 160px !important;
            height: 40px !important;
            line-height: 24px !important;
            min-height: 40px !important;
            max-height: 40px !important;
            box-sizing: border-box !important;
            font-family: inherit !important;
            text-shadow: none !important;
        }

        .date-picker input:focus {
            outline: none !important;
            border-color: #4f9cff !important;
            box-shadow: 0 0 0 2px rgba(79, 156, 255, 0.25) !important;
            background: rgba(10, 10, 26, 0.9) !important;
        }

        .refresh-btn {
            padding: 8px 16px;
            background: rgba(79, 156, 255, 0.2);
            border: 2px solid rgba(79, 156, 255, 0.5);
            border-radius: 6px;
            color: #4f9cff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            background: rgba(79, 156, 255, 0.3);
            border-color: rgba(79, 156, 255, 0.8);
            transform: translateY(-1px);
        }

        .content {
            padding: 30px;
            color: #E5E7EB;
        }

        .stat-card {
            background: rgba(17, 24, 39, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(79, 156, 255, 0.3);
            box-shadow: 0 8px 25px rgba(79, 156, 255, 0.1);
        }

        .stat-card h3 {
            color: #4f9cff;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #9CA3AF;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
            background: rgba(17, 24, 39, 0.2);
            border-radius: 8px;
            padding: 16px;
        }

        .heatmap-container {
            background: rgba(17, 24, 39, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .heatmap-cell {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            margin: 1px;
            display: inline-block;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .heatmap-cell:hover {
            transform: scale(1.2);
            z-index: 10;
            position: relative;
        }

        .time-slot-grid {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            gap: 2px;
            margin: 10px 0;
        }

        .time-slot-cell {
            height: 20px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            font-weight: bold;
        }

        .heatmap-legend {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #9CA3AF;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 18px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Flatpickr 深色样式 */
        .flatpickr-calendar {
            background: rgba(10, 10, 26, 0.95) !important;
            border: 4px solid rgba(79, 156, 255, 0.5) !important;
            box-shadow: 0 0 0 2px #000, 0 0 0 4px rgba(79, 156, 255, 0.5), 0 0 20px rgba(79, 156, 255, 0.3) !important;
            color: #e5e7eb !important;
            font-family: inherit !important;
        }

        .flatpickr-months {
            background: rgba(0, 0, 0, 0.3) !important;
            border-bottom: 2px solid rgba(79, 156, 255, 0.5) !important;
        }

        .flatpickr-month {
            color: #4f9cff !important;
            text-shadow: none !important;
        }

        .flatpickr-current-month {
            color: #4f9cff !important;
        }

        .flatpickr-weekdays {
            background: rgba(0, 0, 0, 0.2) !important;
            border-bottom: 1px solid rgba(79, 156, 255, 0.3) !important;
        }

        .flatpickr-weekday {
            color: #4f9cff !important;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5) !important;
        }

        .flatpickr-day {
            color: #e5e7eb !important;
            background: transparent !important;
            border: 1px solid rgba(79, 156, 255, 0.2) !important;
            border-radius: 0 !important;
            margin: 0 !important;
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            text-align: center !important;
        }

        .flatpickr-day:hover {
            background: rgba(79, 156, 255, 0.2) !important;
            border-color: rgba(79, 156, 255, 0.6) !important;
        }

        .flatpickr-day.today {
            background: rgba(79, 156, 255, 0.3) !important;
            border-color: rgba(79, 156, 255, 0.8) !important;
            color: #ffffff !important;
        }

        .flatpickr-day.selected {
            background: rgba(79, 156, 255, 0.6) !important;
            border-color: rgba(79, 156, 255, 1) !important;
            color: #ffffff !important;
        }

        .flatpickr-day.prevMonthDay,
        .flatpickr-day.nextMonthDay {
            color: rgba(229, 231, 235, 0.4) !important;
        }

        .flatpickr-months .flatpickr-prev-month,
        .flatpickr-months .flatpickr-next-month {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            padding: 10px !important;
            color: #4f9cff !important;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5) !important;
        }

        .flatpickr-months .flatpickr-prev-month:hover,
        .flatpickr-months .flatpickr-next-month:hover {
            background: rgba(79, 156, 255, 0.1) !important;
        }

        .flatpickr-months .flatpickr-prev-month svg,
        .flatpickr-months .flatpickr-next-month svg {
            fill: #4f9cff !important;
        }

        .flatpickr-current-month .flatpickr-monthDropdown-months {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            color: #4f9cff !important;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5) !important;
        }

        .flatpickr-current-month .flatpickr-monthDropdown-months:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        .flatpickr-months * {
            box-shadow: none !important;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5) !important;
        }

        .flatpickr-months .flatpickr-prev-month,
        .flatpickr-months .flatpickr-next-month,
        .flatpickr-months .flatpickr-current-month {
            background: transparent !important;
            border: none !important;
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fa fa-bar-chart mr-3"></i>时间统计与分析
            </h1>
            <p>深度分析你的时间使用模式和效率</p>
            
            <div class="controls">
                <div class="date-picker">
                    <label>开始日期:</label>
                    <input type="text" id="startDate" placeholder="选择开始日期">
                </div>
                <div class="date-picker">
                    <label>结束日期:</label>
                    <input type="text" id="endDate" placeholder="选择结束日期">
                </div>
                <button id="refreshBtn" class="refresh-btn">
                    <i class="fa fa-refresh"></i>刷新数据
                </button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Statistics Overview -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="stat-card fade-in">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="stat-label">总工作时长</p>
                            <p class="stat-value text-blue-400" id="totalHours">0 小时</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-500/20 rounded-full flex items-center justify-center">
                            <i class="fa fa-clock-o text-blue-400 text-xl"></i>
                        </div>
                    </div>
                </div>
                
                <div class="stat-card fade-in">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="stat-label">完成任务数</p>
                            <p class="stat-value text-green-400" id="completedTasks">0</p>
                        </div>
                        <div class="w-12 h-12 bg-green-500/20 rounded-full flex items-center justify-center">
                            <i class="fa fa-check-circle text-green-400 text-xl"></i>
                        </div>
                    </div>
                </div>
                
                <div class="stat-card fade-in">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="stat-label">平均效率</p>
                            <p class="stat-value text-purple-400" id="avgEfficiency">0%</p>
                        </div>
                        <div class="w-12 h-12 bg-purple-500/20 rounded-full flex items-center justify-center">
                            <i class="fa fa-tachometer text-purple-400 text-xl"></i>
                        </div>
                    </div>
                </div>
                
                <div class="stat-card fade-in">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="stat-label">最活跃时段</p>
                            <p class="stat-value text-orange-400" id="peakHours">--:--</p>
                        </div>
                        <div class="w-12 h-12 bg-orange-500/20 rounded-full flex items-center justify-center">
                            <i class="fa fa-fire text-orange-400 text-xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <!-- Time Distribution Chart -->
                <div class="stat-card fade-in">
                    <h3>
                        <i class="fa fa-pie-chart text-blue-400"></i>时间分布
                    </h3>
                    <div class="chart-container">
                        <canvas id="timeDistributionChart"></canvas>
                    </div>
                </div>
                
                <!-- Daily Activity Chart -->
                <div class="stat-card fade-in">
                    <h3>
                        <i class="fa fa-line-chart text-green-400"></i>每日活动趋势
                    </h3>
                    <div class="chart-container">
                        <canvas id="dailyActivityChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Heatmap Section -->
            <div class="heatmap-container fade-in mb-8">
                <h3>
                    <i class="fa fa-calendar text-red-400"></i>时间热力图
                </h3>
                <div class="mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm text-gray-400">时间轴 (24小时)</span>
                        <span class="text-sm text-gray-400">活动强度</span>
                    </div>
                    <div class="time-slot-grid" id="timeSlotGrid">
                        <!-- Time slots will be generated here -->
                    </div>
                </div>
                
                <div class="heatmap-legend">
                    <span class="text-sm text-gray-400">活动强度:</span>
                    <div class="legend-item">
                        <div class="heatmap-cell" style="background-color: #ebedf0;"></div>
                        <span>无活动</span>
                    </div>
                    <div class="legend-item">
                        <div class="heatmap-cell" style="background-color: #c6e48b;"></div>
                        <span>低</span>
                    </div>
                    <div class="legend-item">
                        <div class="heatmap-cell" style="background-color: #7bc96f;"></div>
                        <span>中</span>
                    </div>
                    <div class="legend-item">
                        <div class="heatmap-cell" style="background-color: #239a3b;"></div>
                        <span>高</span>
                    </div>
                    <div class="legend-item">
                        <div class="heatmap-cell" style="background-color: #196127;"></div>
                        <span>极高</span>
                    </div>
                </div>
            </div>

            <!-- Project Analysis -->
            <div class="stat-card fade-in">
                <h3>
                    <i class="fa fa-folder text-yellow-400"></i>项目分析
                </h3>
                <div class="chart-container">
                    <canvas id="projectAnalysisChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 背景图函数
        function getRandomBackground() {
            const backgrounds = [
                '/static/images/背景图2/树屋.webp',
                '/static/images/背景图2/沙漏.webp',
                '/static/images/背景图2/猫咪2.webp',
                '/static/images/背景图2/猫咪.webp'
            ];
            return backgrounds[Math.floor(Math.random() * backgrounds.length)];
        }

        // 设置背景图
        function setBackground() {
            const randomBg = getRandomBackground();
            document.body.style.backgroundImage = `linear-gradient(to right, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.1) 100%), url('${randomBg}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundRepeat = 'no-repeat';
            document.body.style.backgroundAttachment = 'fixed';
        }

        // Global variables
        let startDate, endDate;
        let statisticsData = {};
        const API_BASE_URL = 'http://localhost:5005';
        let chartInstances = {
            timeDistributionChart: null,
            dailyActivityChart: null,
            projectAnalysisChart: null
        };

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            setBackground();
            initializeDatePickers();
            generateTimeSlots();
            loadStatistics();
        });
        
        // Initialize date pickers
        function initializeDatePickers() {
            // 确保使用有数据的日期范围
            let defaultStartDate = new Date("2025-09-01");
            let defaultEndDate = new Date("2025-09-10");

            const startDatePicker = flatpickr("#startDate", {
                dateFormat: "Y-m-d",
                defaultDate: defaultStartDate,
                onChange: function(selectedDates) {
                    startDate = selectedDates[0];
                    loadStatistics();
                }
            });

            const endDatePicker = flatpickr("#endDate", {
                dateFormat: "Y-m-d",
                defaultDate: defaultEndDate,
                onChange: function(selectedDates) {
                    endDate = selectedDates[0];
                    loadStatistics();
                }
            });

            // Set initial dates
            startDate = defaultStartDate;
            endDate = defaultEndDate;

            // 立即加载统计数据
            loadStatistics();
        }
        
        // Generate time slots for heatmap
        function generateTimeSlots() {
            const grid = document.getElementById('timeSlotGrid');
            grid.innerHTML = '';
            
            for (let hour = 0; hour < 24; hour++) {
                const cell = document.createElement('div');
                cell.className = 'time-slot-cell';
                cell.textContent = hour.toString().padStart(2, '0');
                cell.style.backgroundColor = '#ebedf0';
                cell.title = `${hour}:00 - ${hour + 1}:00`;
                grid.appendChild(cell);
            }
        }
        
        // Load statistics data from API
        async function loadStatistics() {
            if (!startDate || !endDate) return;

            try {
                showLoading();

                // Fetch data for date range
                const data = await fetchStatisticsData();

                // Update statistics
                updateStatistics(data);
                updateCharts(data);
                updateHeatmaps(data);

                hideLoading();

            } catch (error) {
                console.error('Error loading statistics:', error);
                hideLoading();
                // Show fallback data if API fails
                showFallbackData();
            }
        }
        
        // Fetch data for date range
        async function fetchDateRangeData() {
            const promises = [];
            const currentDate = new Date(startDate);
            
            while (currentDate <= endDate) {
                const dateStr = currentDate.toISOString().split('T')[0];
                promises.push(fetchScheduleData(dateStr));
                currentDate.setDate(currentDate.getDate() + 1);
            }
            
            const results = await Promise.all(promises);
            return processScheduleData(results);
        }
        
        // Fetch schedule data for a specific date
        async function fetchScheduleData(date) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/schedule/${date}?user_id=1`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return { date, data: data.schedule_data };
            } catch (error) {
                console.error(`Error fetching data for ${date}:`, error);
                return { date, data: [] };
            }
        }
        
        // Process schedule data into statistics
        function processScheduleData(results) {
            const allSchedules = [];
            const hourlyActivity = {};
            const projectStats = {};
            const dailyHours = {};
            
            // Initialize hourly activity
            for (let hour = 0; hour < 24; hour++) {
                hourlyActivity[hour] = 0;
            }
            
            results.forEach(({ date, data }) => {
                allSchedules.push(...data);
                
                // Calculate daily hours
                let dailyTotal = 0;
                data.forEach(schedule => {
                    if (schedule.time_slot) {
                        const hours = calculateTimeSlotHours(schedule.time_slot);
                        dailyTotal += hours;
                        
                        // Update hourly activity
                        const startHour = extractStartHour(schedule.time_slot);
                        if (startHour !== null) {
                            hourlyActivity[startHour] = (hourlyActivity[startHour] || 0) + 1;
                        }
                        
                        // Update project stats
                        const projectName = schedule.planned_subtask_name || schedule.actual_subtask_name || '其他';
                        projectStats[projectName] = (projectStats[projectName] || 0) + hours;
                    }
                });
                
                dailyHours[date] = dailyTotal;
            });
            
            return {
                totalHours: Object.values(dailyHours).reduce((sum, hours) => sum + hours, 0),
                completedTasks: allSchedules.length,
                avgEfficiency: calculateEfficiency(allSchedules),
                peakHours: findPeakHours(hourlyActivity),
                timeDistribution: projectStats,
                dailyActivity: Object.entries(dailyHours).map(([date, hours]) => ({ date, hours })),
                hourlyActivity,
                projectAnalysis: projectStats
            };
        }
        
        // Calculate hours from time slot string
        function calculateTimeSlotHours(timeSlot) {
            if (!timeSlot) return 0;
            const parts = timeSlot.split('-');
            if (parts.length !== 2) return 0;
            
            const startTime = parseTime(parts[0]);
            const endTime = parseTime(parts[1]);
            
            if (startTime && endTime) {
                return endTime - startTime;
            }
            return 0;
        }
        
        // Parse time string to decimal hours
        function parseTime(timeStr) {
            const parts = timeStr.split(':');
            if (parts.length !== 2) return null;
            
            const hours = parseInt(parts[0]);
            const minutes = parseInt(parts[1]);
            
            if (isNaN(hours) || isNaN(minutes)) return null;
            
            return hours + minutes / 60;
        }
        
        // Extract start hour from time slot
        function extractStartHour(timeSlot) {
            if (!timeSlot) return null;
            const parts = timeSlot.split('-');
            if (parts.length !== 2) return null;
            
            const startTime = parseTime(parts[0]);
            return startTime ? Math.floor(startTime) : null;
        }
        
        // Calculate efficiency (simplified)
        function calculateEfficiency(schedules) {
            if (schedules.length === 0) return 0;
            
            let plannedCount = 0;
            let actualCount = 0;
            
            schedules.forEach(schedule => {
                if (schedule.planned_subtask_name) plannedCount++;
                if (schedule.actual_subtask_name) actualCount++;
            });
            
            return plannedCount > 0 ? Math.round((actualCount / plannedCount) * 100) : 0;
        }
        
        // Find peak hours
        function findPeakHours(hourlyActivity) {
            let maxActivity = 0;
            let peakHour = 0;
            
            for (let hour = 0; hour < 24; hour++) {
                if (hourlyActivity[hour] > maxActivity) {
                    maxActivity = hourlyActivity[hour];
                    peakHour = hour;
                }
            }
            
            if (maxActivity === 0) return '--:--';
            
            const endHour = peakHour + 2;
            return `${peakHour.toString().padStart(2, '0')}:00-${endHour.toString().padStart(2, '0')}:00`;
        }
        
        // Update statistics cards
        function updateStatistics(data) {
            document.getElementById('totalHours').textContent = `${data.totalHours || data.total_hours || 0} 小时`;
            document.getElementById('completedTasks').textContent = data.completedTasks || data.completed_tasks || 0;
            document.getElementById('avgEfficiency').textContent = `${data.avgEfficiency || data.avg_efficiency || 0}%`;
            document.getElementById('peakHours').textContent = data.peakHours || data.peak_hours || '--:--';
        }
        
        // Update charts
        function updateCharts(data) {
            updateTimeDistributionChart(data.timeDistribution || data.time_distribution || {});
            updateDailyActivityChart(data.dailyActivity || data.daily_activity || []);
            updateProjectAnalysisChart(data.projectAnalysis || data.project_analysis || {});
        }
        
        // Update time distribution chart
        function updateTimeDistributionChart(data) {
            const ctx = document.getElementById('timeDistributionChart').getContext('2d');

            // 销毁旧的图表实例
            if (chartInstances.timeDistributionChart) {
                chartInstances.timeDistributionChart.destroy();
            }

            const labels = Object.keys(data);
            const values = Object.values(data);

            if (labels.length === 0) {
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.fillStyle = '#E5E7EB';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', ctx.canvas.width / 2, ctx.canvas.height / 2);
                return;
            }

            chartInstances.timeDistributionChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#F97316'],
                        borderWidth: 2,
                        borderColor: 'rgba(255, 255, 255, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#E5E7EB',
                                font: {
                                    size: 12
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // Update daily activity chart
        function updateDailyActivityChart(data) {
            const ctx = document.getElementById('dailyActivityChart').getContext('2d');

            // 销毁旧的图表实例
            if (chartInstances.dailyActivityChart) {
                chartInstances.dailyActivityChart.destroy();
            }

            if (data.length === 0) {
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.fillStyle = '#E5E7EB';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', ctx.canvas.width / 2, ctx.canvas.height / 2);
                return;
            }

            chartInstances.dailyActivityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => new Date(d.date).toLocaleDateString()),
                    datasets: [{
                        label: '工作时长 (小时)',
                        data: data.map(d => d.hours),
                        borderColor: '#10B981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#E5E7EB'
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#E5E7EB'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#E5E7EB'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    }
                }
            });
        }
        
        // Update project analysis chart
        function updateProjectAnalysisChart(data) {
            const ctx = document.getElementById('projectAnalysisChart').getContext('2d');

            // 销毁旧的图表实例
            if (chartInstances.projectAnalysisChart) {
                chartInstances.projectAnalysisChart.destroy();
            }

            const labels = Object.keys(data);
            const values = Object.values(data);

            if (labels.length === 0) {
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.fillStyle = '#E5E7EB';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', ctx.canvas.width / 2, ctx.canvas.height / 2);
                return;
            }

            chartInstances.projectAnalysisChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '工作时长 (小时)',
                        data: values,
                        backgroundColor: ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#F97316'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#E5E7EB'
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#E5E7EB'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#E5E7EB'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    }
                }
            });
        }
        
        // Update heatmaps
        function updateHeatmaps(data) {
            updateHourlyHeatmap(data.hourlyActivity || data.hourly_activity || {});
        }
        
        // Update hourly heatmap
        function updateHourlyHeatmap(data) {
            const cells = document.querySelectorAll('.time-slot-cell');
            const maxActivity = Math.max(...Object.values(data));
            
            cells.forEach((cell, index) => {
                const activity = data[index] || 0;
                const intensity = maxActivity > 0 ? activity / maxActivity : 0;
                
                const colors = ['#ebedf0', '#c6e48b', '#7bc96f', '#239a3b', '#196127'];
                let colorIndex = 0;
                
                if (intensity > 0.8) colorIndex = 4;
                else if (intensity > 0.6) colorIndex = 3;
                else if (intensity > 0.4) colorIndex = 2;
                else if (intensity > 0.2) colorIndex = 1;
                else colorIndex = 0;
                
                cell.style.backgroundColor = colors[colorIndex];
                cell.title = `${index}:00 - ${index + 1}:00 (活动次数: ${activity})`;
            });
        }
        
        // Show fallback data when API fails
        function showFallbackData() {
            const fallbackData = {
                totalHours: 0,
                total_hours: 0,
                completedTasks: 0,
                completed_tasks: 0,
                avgEfficiency: 0,
                avg_efficiency: 0,
                peakHours: '--:--',
                peak_hours: '--:--',
                timeDistribution: {},
                time_distribution: {},
                dailyActivity: [],
                daily_activity: [],
                hourlyActivity: {},
                hourly_activity: {},
                projectAnalysis: {},
                project_analysis: {}
            };

            updateStatistics(fallbackData);
            updateCharts(fallbackData);
            updateHeatmaps(fallbackData);
        }
        
        // Show loading state
        function showLoading() {
            const chartContainers = document.querySelectorAll('.chart-container');
            chartContainers.forEach(container => {
                if (!container.querySelector('.loading')) {
                    const loading = document.createElement('div');
                    loading.className = 'loading';
                    loading.innerHTML = '<div class="spinner"></div>加载中...';
                    container.appendChild(loading);
                }
            });
        }
        
        // Hide loading state
        function hideLoading() {
            const loadingElements = document.querySelectorAll('.loading');
            loadingElements.forEach(element => element.remove());
        }

        // Fetch statistics data from API
        async function fetchStatisticsData() {
            try {
                // 使用 flatpickr 的日期格式 YYYY-MM-DD
                const startDateStr = startDate instanceof Date ? startDate.toISOString().split('T')[0] : startDate;
                const endDateStr = endDate instanceof Date ? endDate.toISOString().split('T')[0] : endDate;

                const response = await fetch(`${API_BASE_URL}/api/statistics?start_date=${startDateStr}&end_date=${endDateStr}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();
                if (result.status === 'success' && result.data) {
                    return result.data;
                } else {
                    throw new Error('API response format error');
                }
            } catch (error) {
                console.error('Error fetching statistics:', error);
                throw error;
            }
        }

        // 刷新按钮事件
        document.getElementById('refreshBtn').addEventListener('click', function() {
            // 重新设置背景图
            setBackground();
            // 重新加载数据
            loadStatistics();
        });
    </script>
</body>
