<!DOCTYPE html>
<html>
<head>
    <title>统计测试</title>
</head>
<body>
    <h1>统计API测试</h1>
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            try {
                const response = await fetch('http://localhost:5005/api/statistics?start_date=2025-08-01&end_date=2025-08-31');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p>错误: ' + error.message + '</p>';
            }
        }
        
        testAPI();
    </script>
</body>
</html>
