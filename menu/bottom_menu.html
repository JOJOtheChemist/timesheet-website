<script>
function openAIChat() {
    // 获取当前用户ID，这里需要根据您的用户系统来获取
    // 假设用户ID存储在localStorage中，或者从其他地方获取
    let userID = localStorage.getItem('userID') || 
                 localStorage.getItem('username') || 
                 sessionStorage.getItem('userID') || 
                 sessionStorage.getItem('username') || 
                 'default_user'; // 默认用户ID
    
    // 构建跳转URL，传递用户ID作为参数
    const aiChatURL = `http://140.143.194.215/kode-new/?userID=${encodeURIComponent(userID)}`;
    
    // 在新标签页中打开AI对话页面
    window.open(aiChatURL, '_blank');
    
    console.log('跳转到AI对话页面，用户ID:', userID);
}
