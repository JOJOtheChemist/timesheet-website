<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>占位页面</title>
  <style>
    body { margin:0; background:#0a0a1a; color:#e5e7eb; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif; }
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .box { padding:24px 28px; border-radius:10px; background:rgba(10,10,26,0.95); border:4px solid rgba(79,156,255,0.5); box-shadow: 0 0 0 2px #000, 0 0 0 4px rgba(79,156,255,0.5), 0 0 20px rgba(79,156,255,0.3); backdrop-filter:blur(10px); }
    .text { color:#4f9cff; font-size:18px; font-weight:600; text-shadow:2px 2px 0 rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div class="wrap"><div class="box"><div class="text">占位页面</div></div></div>
</body>
</html>
